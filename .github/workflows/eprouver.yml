# Éprouve le vault avant qu'il ne devienne du corpus.
#
# ## Ce que ça attrape
#
# Le vault est du markdown écrit à la main. Le pipeline en tire un corpus, et
# il est strict : un slot absent de `corpus-order.md`, un renvoi qui ne pointe
# rien, un balisage de niveau mal fermé, un intraduisible sans fiche — chacune
# de ces choses l'arrête.
#
# Jusqu'ici, rien ne le lui demandait avant la fusion. Une unité mal formée
# passait dans `main`, et la panne ne se voyait qu'au déploiement du site, dans
# un autre dépôt, sous un message qui parlait de Rust plutôt que du verset en
# cause. Depuis que `propager.yml` existe, elle se verrait dans **deux**
# déploiements à la fois.
#
# Ce job pose la question au bon moment : le corpus se construit-il à partir de
# ce que cette pull request écrit ?
#
# ## Il ne publie rien
#
# Pas de secret, pas de droit, aucun déploiement. Il construit le corpus dans
# l'espace de travail du job et le jette. La seule chose qu'il produise est un
# verdict.

name: Éprouver

# **Toute** pull request, et non les seules qui visent `main`.
#
# La restriction `branches: [main]` laisse passer une PR sans aucune
# vérification : un travail qui dépend d'un autre encore en revue se base sur
# **sa** branche, donc la PR ne vise pas `main` et le job ne s'arme pas. GitHub
# affiche « no checks », et rien ne le signale — une absence de vérification ne
# ressemble pas à un échec. On lit « aucune erreur » là où il faut lire « rien
# n'a été essayé ».
#
# Le défaut a été trouvé dans le dépôt du site, où il avait laissé passer une
# PR entière ; il était identique ici. Et le vault est le pire endroit pour
# l'avoir : une unité mal formée qui arrive dans `main` par la base d'une autre
# branche casse **deux** déploiements, dans deux dépôts, sous un message qui
# parle de Rust plutôt que du verset en cause.
#
# Élargir ne coûte que quelques minutes de CI. Et ça n'ouvre rien : ce job n'a
# ni secret ni droit, il construit le corpus dans son espace de travail et le
# jette.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: eprouver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eprouver:
    runs-on: ubuntu-latest

    steps:
      # Le vault tel que cette pull request le laisse, et le pipeline qui le
      # lit. Côte à côte, comme sur un poste : le pipeline attend le vault dans
      # `ONT_VAULT`.
      - name: Le vault
        uses: actions/checkout@v4
        with:
          path: ONTBibleTranslation

      - name: Le pipeline
        uses: actions/checkout@v4
        with:
          repository: ONTBible/ONTBibleApp
          path: ONTBibleApp

      # Ce que le pipeline lit, et ce que la propagation surveille.
      #
      # `propager.yml` filtre sur une liste de chemins recopiée à la main
      # depuis les constantes du pipeline — `TREES`, `SKELETON`, `REFERENCE`,
      # `LEXIQUE` de `pipeline/src/config.rs`. GitHub n'accepte pas de filtre
      # calculé, donc la duplication est inévitable.
      #
      # Ce qui ne l'est pas, c'est qu'elle dérive en silence. **C'est arrivé le
      # 20 août 2026** : `lexique/` a été ajouté au pipeline et la liste ne l'a
      # pas su. Une fiche corrigée seule ne partait plus en ligne — et le
      # défaut est resté invisible parce que les premières fiches arrivaient
      # avec une modification de `CLAUDE.md`, qui déclenchait à leur place.
      #
      # Une valeur recopiée qu'aucun contrôle ne rapproche de sa source finit
      # toujours par diverger. Ce pas la rapproche.
      - name: La propagation suit ce que le pipeline lit
        run: |
          python3 - <<'CONTROLE'
          import re, sys, pathlib

          config = pathlib.Path("ONTBibleApp/pipeline/src/config.rs").read_text()
          workflow = pathlib.Path(
              "ONTBibleTranslation/.github/workflows/propager.yml"
          ).read_text()

          # Les dossiers du vault que le pipeline ouvre, tirés de ses constantes.
          #
          # `TREES` est ciblée par son nom, et non par la forme de ses tuples :
          # `config.rs` en porte d'autres — les titres d'affichage des corpus
          # et des modes — qu'un relevé par la forme ramasserait aussi. Le
          # contrôle annoncerait alors « Kenesset » et « Torah » comme des
          # dossiers manquants. Éprouvé avant d'être livré.
          vault = pathlib.Path("ONTBibleTranslation")
          lus = set()

          trees = re.search(r"TREES[^=]*=\s*\[(.*?)\];", config, re.S)
          if trees:
              lus.update(re.findall(r'"[^"]+",\s*"([^"]+)"', trees.group(1)))

          # Toute constante de chaîne dont la valeur **existe dans le vault**.
          #
          # Pas une liste de noms — `SKELETON`, `REFERENCE`, `LEXIQUE` — parce
          # qu'une liste de noms est exactement le défaut qu'on corrige : elle
          # ne connaîtrait pas la constante suivante. C'est le disque qui
          # tranche, donc une constante ajoutée demain est vue sans que
          # personne n'y pense.
          for valeur in re.findall(r'pub const [A-Z_]+: &str = "([^"]+)"', config):
              if (vault / valeur).exists():
                  lus.add(valeur)

          if not lus:
              sys.exit("aucune constante relevée — le relevé est cassé, pas le filtre")

          # Les chemins que la propagation surveille.
          bloc = re.search(r'paths:\n((?:\s*-\s*"[^"]+"\n)+)', workflow)
          if not bloc:
              sys.exit("propager.yml n'a plus de bloc « paths »")
          surveilles = set(re.findall(r'"([^"]+)"', bloc.group(1)))

          def couvert(cible: str) -> bool:
              return any(
                  c == cible or c == f"{cible}/**" or c.rstrip("/*") == cible
                  for c in surveilles
              )

          manquants = sorted(c for c in lus if not couvert(c))
          if manquants:
              print("::error::Le pipeline lit des chemins que la propagation ne surveille pas :")
              for c in manquants:
                  print(f"::error::  {c}")
              print("::error::Une correction qui ne touche qu'eux ne partirait pas en ligne.")
              print("::error::Ajouter ces chemins au bloc « paths » de propager.yml.")
              sys.exit(1)

          print(f"{len(lus)} chemins lus par le pipeline, tous surveillés :")
          for c in sorted(lus):
              print(f"  {c}")
          CONTROLE

      - name: Rust
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ONTBibleApp/pipeline

      # Le pipeline s'arrête sur la première incohérence, et son message nomme
      # le fichier. C'est lui le test : il n'y a rien à écrire à côté.
      - name: Le corpus se construit
        working-directory: ONTBibleApp
        env:
          ONT_VAULT: ${{ github.workspace }}/ONTBibleTranslation
        # `--bin` explicite. La caisse du pipeline en porte deux depuis que le
        # schéma engendre les liaisons Swift, et `cargo run` sans `--bin` refuse
        # alors de choisir — la vérification s'arrêterait ici, sur une erreur
        # qui ne parle pas du vault.
        run: cargo run --manifest-path pipeline/Cargo.toml --bin ont-pipeline --release --quiet

      # Ce que la traduction pèse après cette pull request. Le chiffre n'est pas
      # un contrôle — c'est ce qu'on lit en diagonale pour voir qu'une unité a
      # bien été prise en compte, ou qu'aucune n'a disparu par accident.
      - name: Ce que ça donne
        working-directory: ONTBibleApp
        run: |
          echo "── manifest.json ──"
          head -c 600 dist/manifest.json; echo
          echo "── livres produits ──"
          ls dist/books | wc -l
