# Une correction du vault part en ligne toute seule.
#
# ## Ce qui manquait
#
# Le vault est la **source** de la traduction. Le corpus, lui, est un produit :
# ni le site ni l'app ne le portent dans leur dépôt, chacun le régénère depuis
# ce vault au moment où il se construit. C'est la bonne architecture, et elle
# avait un trou.
#
# Corriger un verset ici ne changeait rien nulle part. Le site en ligne gardait
# l'ancienne leçon, et l'app aussi, jusqu'à ce que quelqu'un pousse un commit
# sans rapport dans l'un des deux autres dépôts. La correction existait,
# publiée, signée — et invisible.
#
# Ce workflow ferme ça : le vault bouge, les deux chaînes partent.
#
# ## Pourquoi un jeton, alors que rien d'autre ici n'en demande
#
# `secrets.GITHUB_TOKEN` ne vaut que pour **ce** dépôt. Déclencher un workflow
# chez un voisin demande un droit sur le voisin, et GitHub n'en prête aucun
# d'office — c'est ce qui empêche un dépôt d'en piloter un autre par accident.
#
# Il faut donc un jeton **fin**, créé une fois, limité à deux dépôts et à une
# seule permission :
#
#     https://github.com/settings/personal-access-tokens
#
#     Repository access : ONTBible/ONTBibleWebapp et ONTBible/ONTBibleApp
#     Permissions       : Actions → Read and write   (et rien d'autre)
#
# Puis, dans ce dépôt-ci :
#
#     Settings → Secrets and variables → Actions → New repository secret
#     Nom : DECLENCHEUR
#
# Ce jeton ne peut que **lancer** des workflows. Il ne lit aucun code, n'écrit
# aucun commit, ne touche à aucun secret. Et il ne donne aucun accès à AWS :
# les droits de déploiement viennent d'OIDC, du côté du dépôt déclenché, et
# sont épinglés à sa branche `main`.
#
# ## Ce que ça coûte, et où le couper
#
# Le site : quelques minutes sur un runner Linux, gratuit dans les quotas.
#
# L'app : un build macOS, dix fois plus cher en minutes, et **un numéro de
# build consommé, livré aux testeurs**. Une virgule corrigée dans un brouillon
# leur enverra donc une notification. Si ça devient bruyant, retirer l'étape
# « L'app » ci-dessous : le site continuera seul.

name: Propager

on:
  push:
    branches: [main]
    # Seulement ce que le pipeline lit vraiment. Les valeurs viennent de ses
    # constantes — `pipeline/src/config.rs` : `TREES`, `SKELETON`, `REFERENCE`.
    # Un fichier Affinity, une note de session, un paratexte ne produisent pas
    # une ligne de corpus, et n'ont donc pas à déclencher deux constructions.
    #
    # Le revers est une **duplication** : si le pipeline se met à lire un
    # dossier de plus, cette liste ne le saura pas, et la correction ne partira
    # pas. C'est le seul endroit du projet où une valeur du pipeline est
    # recopiée, et c'est un compromis assumé — GitHub n'accepte pas de filtre
    # calculé. À vérifier au prochain dossier ajouté.
    #
    # C'est arrivé, le 20 août 2026. `lexique/` a été ajouté au pipeline
    # (`config.rs`, constante `LEXIQUE`) et cette liste ne l'a pas su : une
    # fiche corrigée seule ne partait pas en ligne. Le défaut n'a pas été vu
    # tout de suite parce que les premières fiches arrivaient avec une
    # modification de `CLAUDE.md`, qui déclenchait à leur place.
    paths:
      - "locked/**"
      - "brouillons/**"
      - "in-writing/**"
      - "CLAUDE.md"
      - "lexique/**"
      - ".github/workflows/propager.yml"
  workflow_dispatch:

# Cinq corrections poussées coup sur coup ne doivent pas lancer cinq
# déploiements. Le dernier annule ceux qui attendent : chacun reconstruit tout
# le corpus depuis le vault, donc le dernier suffit et contient les autres.
concurrency:
  group: propager
  cancel-in-progress: true

jobs:
  propager:
    runs-on: ubuntu-latest

    steps:
      # Le jeton est éprouvé pour de bon, et pas seulement compté.
      #
      # Trois pannes se ressemblent et ne se disent pas : le secret absent, le
      # jeton **expiré** — un jeton fin dure un an au plus, et il s'éteint sans
      # prévenir — et le jeton créé avec la mauvaise permission ou le mauvais
      # propriétaire, cas le plus courant : un jeton dont le *resource owner*
      # est le compte personnel plutôt que l'organisation ne reçoit qu'un accès
      # en lecture aux dépôts publics.
      #
      # Dans les trois cas, `gh workflow run` rendrait une erreur qui parle
      # d'authentification sans nommer laquelle. On pose donc la question à
      # l'API, sur le droit exact dont on a besoin, et on l'écrit en clair.
      # `L'arrivée` lit la date du dernier commit pour savoir ce que la chaîne
      # doit publier. Sans dépôt, `git log` rend 128 et l'étape meurt avant sa
      # première mesure — c'est ce qui est arrivé le 30 août, à sa toute
      # première exécution : la garde avait été éprouvée sur trois cas de
      # comparaison, jamais dans l'environnement où elle tourne.
      #
      # Les trois autres étapes n'appellent que l'API et n'en ont pas besoin ;
      # c'est pour ça qu'aucun checkout n'existait. `fetch-depth: 1` suffit —
      # on ne lit qu'un commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Le jeton peut déclencher
        env:
          GH_TOKEN: ${{ secrets.DECLENCHEUR }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Le secret DECLENCHEUR manque. Voir l'en-tête de ce fichier."
            exit 1
          fi
          # On interroge l'API **des Actions** de chaque dépôt. C'est le droit
          # qu'on demande, et c'est donc lui qu'il faut éprouver — `permissions`
          # sur le dépôt refléterait le rôle de la personne qui a créé le jeton,
          # pas les droits du jeton, et un propriétaire d'organisation y
          # passerait toujours.
          #
          # Ça prouve la lecture. L'écriture, seul un déclenchement la prouve —
          # c'est l'étape suivante. Mais les trois pannes muettes sont écartées
          # ici, donc un échec plus bas ne pourra plus être qu'un défaut de
          # permission en écriture, ce qui se lit enfin.
          #
          # La réponse de l'API est **rendue**, et ce n'est pas un détail. Une
          # première version l'avalait dans `2>/dev/null` : elle annonçait que
          # le jeton ne voyait pas le dépôt, sans dire pourquoi. Or les causes
          # sont distinctes, et le code HTTP les sépare — corriger la mauvaise
          # coûte un aller-retour dans les réglages de GitHub à chaque essai.
          for depot in ONTBible/ONTBibleWebapp ONTBible/ONTBibleApp; do
            if reponse=$(gh api "repos/$depot/actions/workflows" --jq '.total_count' 2>&1); then
              echo "  $depot : $reponse workflows visibles"
              continue
            fi

            echo "::error::Le jeton ne voit pas les workflows de $depot."
            echo "::error::Réponse de l'API : $reponse"

            case "$reponse" in
              *401*|*"Bad credentials"*)
                echo "::error::401 — le jeton est invalide ou expiré. En regénérer un."
                ;;
              *403*)
                echo "::error::403 — le jeton est reconnu mais n'a pas le droit."
                echo "::error::Permissions du jeton → Repository permissions → Actions : Read and write."
                ;;
              *404*|*"Not Found"*)
                # Le 404 est le plus trompeur des trois : GitHub ne distingue
                # pas « ce dépôt n'existe pas » de « ton jeton n'a pas le droit
                # de savoir qu'il existe ». Sur une organisation, la cause la
                # plus fréquente n'est pas la permission mais l'**approbation**.
                echo "::error::404 — GitHub ne distingue pas « absent » de « interdit »."
                echo "::error::Sur une organisation, trois causes, dans cet ordre de fréquence :"
                echo "::error::  1. le jeton attend une approbation —"
                echo "::error::     ONTBible → Settings → Third-party Access → Personal access tokens"
                echo "::error::     → Pending requests. L'approuver."
                echo "::error::  2. l'organisation interdit les jetons fins — même écran, Settings."
                echo "::error::  3. resource owner = le compte personnel au lieu de ONTBible,"
                echo "::error::     ou le dépôt n'est pas coché dans la liste du jeton."
                ;;
            esac
            exit 1
          done

      - name: Le site
        env:
          GH_TOKEN: ${{ secrets.DECLENCHEUR }}
        run: |
          gh workflow run deployer.yml --repo ONTBible/ONTBibleWebapp --ref main
          echo "→ https://github.com/ONTBible/ONTBibleWebapp/actions/workflows/deployer.yml"

      # ── Pourquoi il n'y a plus de déclenchement de l'app ici ──────────
      #
      # Il y en avait un : chaque publication du vault lançait `livraison.yml`
      # sur `ONTBibleApp`, canal interne. Retiré le 31 août 2026, sur décision
      # de l'auteur, et la question qui l'a amenée mérite d'être citée :
      #
      #   « pourquoi c'est nécessaire de faire un nouveau build ?
      #     je croyais que l'app téléchargeait depuis le site ? »
      #
      # Elle télécharge. `ONTData/Remote/CorpusUpdater.swift` le porte en tête :
      # publié sur `ontbible.com/corpus/`, le corpus atteint les lecteurs **en
      # quelques minutes**, sans compilation, sans envoi à Apple, sans revue.
      # Le déploiement du site déclenché juste au-dessus suffit donc à mettre
      # tout le monde à jour.
      #
      # ## Ce que le build rafraîchissait quand même
      #
      # Le corpus vit **aussi** dans le bundle, comme socle : ce qu'une
      # installation neuve lit avant d'avoir vu le réseau une première fois. Le
      # téléchargement le recouvre ensuite, fichier par fichier.
      #
      # ## Ce qu'on échange, et c'est le vrai libellé de cette décision
      #
      # Pas « on retire un déclenchement inutile ». **On échange la fraîcheur
      # du socle hors ligne contre une place de quota**, et voici pourquoi ce
      # n'était pas le bon prix.
      #
      # Apple limite les téléversements par application, par plateforme et par
      # jour. Ce bloc en consommait **deux** — un iOS, un macOS — à chaque
      # publication d'une **parashah**. Le 31 août la limite est tombée et a
      # bloqué une promotion vers les testeurs :
      #
      #     Upload limit reached. Please wait 1 day and try again.
      #
      # En face, ce qu'on perd est borné : un lecteur qui installe l'app et lit
      # **hors ligne** verra un socle daté de la dernière compilation, jusqu'à
      # sa première connexion. Et les livraisons de code arrivent de toute
      # façon — elles reconstruisent le corpus au passage. Le socle se
      # rafraîchit seul, simplement moins souvent.
      #
      # ## Ce que personne ne pouvait voir depuis un seul dépôt
      #
      # Le vault croyait devoir reconstruire l'app, parce que **rien ici ne
      # disait que l'app savait se mettre à jour seule depuis le site**. La
      # capacité était écrite dans `CorpusUpdater.swift`, deux dépôts plus
      # loin, et ce workflow avait été écrit avant elle sans être relu après.
      #
      # ## Et une seconde raison, découverte en retirant
      #
      # `ONTBibleApp` a renommé ses branches le 31 août — `main` → `app-store`,
      # `staging` → `beta-test`, plus une `device` en tête. Le `--ref main` de
      # ce bloc visait donc **une branche disparue**, et chaque propagation
      # aurait échoué sur une cible inexistante. Le retrait règle les deux.
      #
      # Recompté sur place avant d'écrire ceci : les douze dernières courses de
      # `livraison.yml` sont toutes des `push` sur `dev` ou `staging`. **Aucun
      # `workflow_dispatch`**, donc aucune venue d'ici. Le mécanisme était réel
      # et n'avait pas encore tiré.

      # ── Vérifier que le texte est arrivé, et non que l'ordre est parti ─────
      #
      # ## Le trou que cette étape ferme
      #
      # Les deux étapes ci-dessus **déclenchent et oublient**. Elles rendent
      # vert dès que GitHub accepte l'ordre, et ne peuvent rien savoir de ce
      # qui se passe ensuite : ni qu'un déploiement a échoué, ni qu'il a
      # réussi sans rien publier.
      #
      # Le 30 août 2026, `deployer.yml` du site est tombé **six heures durant**
      # sans que personne l'apprenne. Trois défauts s'y étaient accumulés — un
      # bras de `match` manquant, une estampille jamais posée, une garde qui
      # bloquait tout le site au lieu de la seule publication. Chacun a
      # parfaitement joué son rôle : chacun a refusé de publier plutôt que de
      # publier faux. **Aucun n'a rien dit à personne.** L'auteur l'a découvert
      # en demandant pourquoi son texte n'arrivait pas.
      #
      # ## Pourquoi contrôler l'arrivée plutôt que les maillons
      #
      # On pourrait surveiller chaque étape de la chaîne. On ne le fait pas :
      # une garde par maillon ne couvre que les ruptures qu'on a prévues, et
      # les trois du 30 août étaient toutes imprévues.
      #
      # `ontbible.com/corpus/manifeste.json` est **l'état final observable** —
      # ce qu'un lecteur télécharge. Le vérifier attrape d'un coup toutes les
      # ruptures, y compris celles qu'on n'a pas imaginées, et ne demande de
      # connaître aucun rouage intermédiaire.
      #
      # ## Pourquoi on peut prédire la valeur exacte
      #
      # Le site estampille le corpus avec la date du dernier commit du vault —
      # `config::genere()` du pipeline, alimenté par `ONT_GENERE`. Ce commit,
      # c'est celui qui vient de déclencher ce job. On sait donc **exactement**
      # ce que la chaîne doit publier, et on n'a pas à se contenter d'un « ça a
      # bougé » qui ne prouve pas que c'est notre texte qui est passé.
      #
      # ## Trois pièges, tous rencontrés le 30 août
      #
      # 1. **`format-local` avec `TZ=UTC`, jamais `--date=format:`.** Ce dernier
      #    rend l'heure locale et lui colle un `Z` : la forme reste
      #    irréprochable et la valeur ment de l'écart au méridien. Aucune garde
      #    de la chaîne ne lit la forme assez finement pour le voir.
      # 2. **`>=`, jamais `==`.** Si une seconde fusion double celle-ci pendant
      #    l'attente, le site publiera une estampille *plus récente* que la
      #    nôtre. Le texte est passé ; exiger l'égalité ferait rougir à tort.
      #    La comparaison de chaînes suffit — le format est ordonnable.
      # 3. **Contourner le cache.** `/corpus/` est servi par CloudFront avec
      #    `max-age=300`. Une lecture sans paramètre variable rend jusqu'à cinq
      #    minutes de retard, et cette étape conclurait à une panne. Le 30 août
      #    j'ai failli annoncer un quatrième défaut pour cette seule raison.
      - name: L'arrivée
        run: |
          set -euo pipefail
          attendu="$(TZ=UTC git log -1 --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd)"
          echo "estampille attendue : $attendu"

          limite=$((SECONDS + 1800))
          while [ "$SECONDS" -lt "$limite" ]; do
            publie="$(curl -fsS --max-time 30 \
              "https://ontbible.com/corpus/manifeste.json?t=$RANDOM$SECONDS" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("genere",""))' \
              2>/dev/null || echo "")"

            if [ -n "$publie" ] && [ ! "$publie" \< "$attendu" ]; then
              echo "→ arrivé : $publie"
              exit 0
            fi
            echo "   publié : ${publie:-—} — on attend"
            sleep 30
          done

          echo "::error::Le corpus n'est pas arrivé aux lecteurs en trente minutes."
          echo "::error::Attendu au moins : $attendu"
          echo "::error::Publié à l'instant : ${publie:-aucune estampille}"
          echo "::error::La chaîne est rompue **après** ce dépôt. Regarder, dans l'ordre :"
          echo "::error::  1. https://github.com/ONTBible/ONTBibleWebapp/actions/workflows/deployer.yml"
          echo "::error::  2. l'étape « Le corpus pour l'app » de ce déploiement — elle refuse"
          echo "::error::     délibérément un corpus indatable, et son message dit quoi remplir."
          echo "::error::  3. https://ontbible.com/corpus/manifeste.json — si le champ genere"
          echo "::error::     est vide, c'est ONT_GENERE qui manque à l'appelant du pipeline."
          exit 1
